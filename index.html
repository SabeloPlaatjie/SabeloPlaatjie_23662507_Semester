<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Web Application Development</title>
    <style>
        #map{position: absolute; top: 0; bottom: 0; margin-top: 60px; width: 100%;}
        .topnav {overflow: hidden;}
        .topnav a {
        float: left;
        display: block;
        color: black;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
        }

        .topnav a:hover {
        background-color: #ddd;
        color: black;
        }

        .topnav input[type=text] {
        float: right;
        padding: 6px;
        margin-top: 8px;
        margin-right: 16px;
        border: none;
        font-size: 17px;
                }
        @media screen and (max-width: 600px) {
        .topnav a, .topnav input[type=text] {
            float: none;
            display: block;
            text-align: left;
            width: 100%;
            margin: 0;
            padding: 14px;
        }

        .topnav input[type=text] {
            border: 1px solid #8d0000;  
        }
}
    </style>
</head>
<body>
    <footer style="background: purple; color: white;">
         <div class="topnav">
             <a class="active" style="color: white;" >UNIVERSITY OF PRETORIA SMART CAMPUS</a>
            <input type="text" placeholder="Search..">
    </footer>  

    <div id ="map"></div>
        <script src="Building.js"></script>
        <script src="Benches.js"></script>
        <script src="ChairTables.js"></script>
         <script src="FoodLocations.js"></script>

      <script>
            var map = L.map('map').setView([-25.754993, 28.232633],20);
            L.tileLayer('https://api.maptiler.com/maps/openstreetmap/{z}/{x}/{y}.jpg?key=kAG5WgogdK64B0fswGra',{
                attribution:'<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
            }).addTo(map);  
            var buildingLayer = L.geoJSON(buildingData, {
                style: { color: "#ff7800", weight: 10, fillColor: "#ff7800", fillOpacity: 0.5 }
            }).addTo(map); 

            var benchesLayer = L.geoJSON(benchesData, {
                style: { color: "#f1e7e7", weight: 2, fillColor: "#f1e7e7", fillOpacity: 0.2 }
            }).addTo(map); 

            var ChairLayer = L.geoJSON(chairTableData, {
                style: { color: "#108d00", weight: 1, fillColor: "#108d00", fillOpacity: 0.5 }
            }).addTo(map); 
            var ChairLayer = L.geoJSON(foodData, {
                style: { color: "#8d0000", weight: 1, fillColor: "#8d0000", fillOpacity: 0.5 }
            }).addTo(map);
            
      </script>   
</body>
</html>
